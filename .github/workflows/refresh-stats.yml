name: refresh-stats

# Refreshes the cached stats SVGs in public/stats/ so the homepage stays
# current without depending on the external stats services at runtime.
# Commits to main, which triggers next-static-export to redeploy.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh cached stats SVGs
        run: node scripts/fetch-stats.mjs

      - name: Commit refreshed SVGs
        run: |
          if [ -n "$(git status --porcelain public/stats)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/stats
            git commit -m "chore: refresh cached stats SVGs"
            git push
          else
            echo "No stats changes."
          fi
