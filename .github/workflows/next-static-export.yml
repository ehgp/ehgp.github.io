name: next-static-export

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC: rebuild with freshly fetched stats
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # any secrets you want available to the action as env vars
      NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Refresh cached stats SVGs
        # Build fresh stats cards from the GitHub / WakaTime APIs at build time
        # so the deployed site stays current (scheduled daily). Requires the
        # GH_STATS_TOKEN secret (a PAT with repo read access) so private-repo
        # activity is counted like the committed cards; the workflow's own
        # GITHUB_TOKEN only sees public repos and would silently deploy much
        # lower numbers. Without the secret, keep the committed SVGs.
        # Tolerant: if a source is unreachable, keep the committed SVGs as a
        # fallback rather than failing the deploy.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GH_STATS_TOKEN secret not set; keeping committed stats SVGs."
            exit 0
          fi
          node scripts/fetch-stats.mjs

      - name: Build static export
        run: npm run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-out
          path: out

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          force_orphan: true
